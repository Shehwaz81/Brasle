<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img">
  <title>Hearth</title>
  <style>svg { color: #000 } @media (prefers-color-scheme: dark) { svg { color: #fff } }</style>
  <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
    <rect width="200" height="200" fill="white"/>
    <rect y="96" width="200" height="8" fill="black" transform="rotate(-45 100 100)"/>
  </mask>
  <g mask="url(#cut)">
    <circle cx="100" cy="100" r="38" fill="currentColor"/>
    <circle cx="100" cy="100" r="65" stroke="currentColor" stroke-width="38"/>
  </g>
</svg>
