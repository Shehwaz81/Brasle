<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearth Dashboard</title>
<link rel="icon" href="/logo.svg">
<style>
  :root { --bg: #0d0f12; --panel: #171a1f; --line: #2a2f37; --text: #f2f2f2; --dim: #8b93a0;
          --ring: #ffd400; --them: #1f2a3a; --me: #1f3a2a; --assistant: #33264a; --ok: #2c4; --bad: #e33; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 16px; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 28px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .pill { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); font-size: 14px; }
  .pill.on { color: var(--text); border-color: var(--ok); }
  .pill.off { color: var(--text); border-color: var(--bad); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  #rings { display: flex; justify-content: center; gap: 32px; }
  .ring { width: 96px; height: 96px; border-radius: 50%; border: 4px solid #444; display: grid; place-items: center;
          font-size: 22px; color: var(--dim); transition: background 40ms, box-shadow 40ms; }
  .ring.lit { background: var(--ring); border-color: var(--ring); color: #000; box-shadow: 0 0 32px var(--ring); }
  #stat { text-align: center; }
  #stat .big { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #stat .sub { color: var(--dim); }
  #chat { display: flex; flex-direction: column; gap: 10px; max-height: 50vh; overflow-y: auto; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; }
  .msg.them { background: var(--them); align-self: flex-start; }
  .msg.me { background: var(--me); align-self: flex-end; }
  .msg.assistant { background: var(--assistant); align-self: flex-end; }
  .who { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  .raw { color: var(--dim); }
  .final { font-size: 20px; font-weight: 600; }
  .secs { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .urgent { color: #ff6b6b; font-weight: 700; }
  #empty { color: var(--dim); text-align: center; }
  #sim { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #sim label { color: var(--dim); font-size: 14px; }
  #sim input { flex: 1; min-width: 200px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
               background: var(--bg); color: var(--text); font: inherit; }
  #sim button { padding: 10px 16px; border-radius: 8px; border: 0; background: var(--ring); color: #000; font: inherit; font-weight: 700; }
  #sim-status { color: var(--bad); font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <h1><svg viewBox="0 0 200 200" width="28" height="28" fill="none" aria-hidden="true" style="vertical-align: -4px; margin-right: 8px">
      <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
        <rect width="200" height="200" fill="white"/><rect y="96" width="200" height="8" fill="black" transform="rotate(-45 100 100)"/>
      </mask>
      <g mask="url(#cut)"><circle cx="100" cy="100" r="38" fill="currentColor"/><circle cx="100" cy="100" r="65" stroke="currentColor" stroke-width="38"/></g>
    </svg>Hearth</h1>
    <div class="pills">
      <span class="pill" id="p-server">server</span>
      <span class="pill" id="p-phone">phone</span>
      <span class="pill" id="p-mic">mic</span>
      <span class="pill" id="p-play">glove</span>
    </div>
  </header>
  <section id="rings" aria-label="Glove rings">
    <div class="ring" id="r0">1</div><div class="ring" id="r1">2</div><div class="ring" id="r2">3</div>
  </section>
  <section id="stat">
    <div class="big" id="stat-big">0.0 s saved</div>
    <div class="sub">Braille time Claude saved the wearer this session (about 1 s per letter)</div>
    <div class="sub" id="stat-last"></div>
  </section>
  <section>
    <form id="sim">
      <label for="sim-text">Simulate speech</label>
      <input id="sim-text" autocomplete="off" placeholder="Type what someone in the room says, press Enter">
      <button>Hear</button>
      <span id="sim-status" role="status"></span>
    </form>
  </section>
  <section>
    <div id="chat"><div id="empty">Waiting for the first message…</div></div>
  </section>
</main>
<script>
const POLL_MS = 300;
const WHO = {them: "heard", me: "user replied", assistant: "user asked the assistant"};
const $ = id => document.getElementById(id);
let lastKey = "";

function pill(id, text, good) {
  const el = $(id);
  el.textContent = text;
  el.className = "pill " + (good === undefined ? "" : good ? "on" : "off");
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderChat(conv) {
  const chat = $("chat");
  chat.replaceChildren();
  if (!conv.length) { chat.append(el("div", "", "Waiting for the first message…")); return; }
  for (const m of conv) {
    const box = el("div", "msg " + m.who);
    const time = new Date(m.ts * 1000).toLocaleTimeString();
    box.append(el("div", "who", WHO[m.who] + " " + time));
    if (m.raw !== m.final) box.append(el("div", "raw", m.raw));
    box.append(el("div", "final", m.priority === "skip" ? "(skipped)" : m.final || "(no answer)"));
    const meta = [];
    if (m.who === "them") meta.push(`buzz ${m.buzz_raw.toFixed(1)} s raw → ${m.buzz_final.toFixed(1)} s sent`);
    if (m.who === "assistant") meta.push(m.search ? `searched: “${m.search}”` : "no web search");
    if (m.reason) meta.push(m.reason);
    if (m.ms != null) meta.push(`Claude ${m.ms} ms`);
    if (meta.length) {
      const s = el("div", "secs", meta.join(" · "));
      if (m.priority === "urgent") s.prepend(el("span", "urgent", "URGENT · "));
      box.append(s);
    }
    chat.append(box);
  }
  chat.scrollTop = chat.scrollHeight;
}

async function poll() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    const s = await r.json();
    pill("p-server", "server ok", true);
    pill("p-phone", s.phone_connected ? "phone connected" : "phone not connected", s.phone_connected);
    const micName = {pi: "Pi mic", mac: "MacBook mic", phone: "iPhone mic"}[s.mic];
    pill("p-mic", !micName ? "no mic (use Simulate speech)" : s.muted ? micName + " muted (phone speaking)"
                                                                   : micName + " listening",
         !!micName && !s.muted);
    pill("p-play", s.playing ? "glove playing" : "glove idle");
    s.rings.forEach((on, i) => $("r" + i).classList.toggle("lit", on));

    const conv = s.conversation;
    const key = conv.length + ":" + (conv.length ? conv[conv.length - 1].ts : 0);
    if (key !== lastKey) { lastKey = key; renderChat(conv); }

    $("stat-big").textContent = `${s.seconds_saved.toFixed(1)} s saved`;
    const heard = conv.filter(m => m.who === "them").pop();
    if (heard) {
      $("stat-last").textContent = `Last heard: ${heard.buzz_raw.toFixed(1)} s raw → ${heard.buzz_final.toFixed(1)} s sent`;
    }
  } catch (e) {
    pill("p-server", "server unreachable", false);
  } finally {
    setTimeout(poll, POLL_MS);
  }
}
poll();

$("sim").addEventListener("submit", async e => {
  e.preventDefault();
  const input = $("sim-text"), text = input.value.trim();
  if (!text) return;
  input.value = "";  // clear now, not after the fetch, or it wipes whatever was typed meanwhile
  try {
    const r = await fetch("/api/hear", {method: "POST", headers: {"Content-Type": "application/json"},
                                         body: JSON.stringify({text})});
    if (!r.ok) throw new Error(r.status);
    $("sim-status").textContent = "";
  } catch (err) {
    if (!input.value) input.value = text;
    $("sim-status").textContent = "not sent";
  }
});
</script>
</body>
</html>
